name: Telegram Bot Listener

on:
  workflow_dispatch:
    # Allow API triggers from cron-job.org every 1 minute

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Telegram Bot Coordinator
      env:
        CLOUDFLARE_API_URL: ${{ secrets.CLOUDFLARE_API_URL }}
        CLOUDFLARE_SYNC_TOKEN: ${{ secrets.CLOUDFLARE_SYNC_TOKEN }}
        DEFAULT_PLAYER_URL: ${{ secrets.DEFAULT_PLAYER_URL }}
        SPREADSHEET_NAME: ${{ secrets.SPREADSHEET_NAME }}
        DEFAULT_TIMEZONE: ${{ secrets.DEFAULT_TIMEZONE }}
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        SCRAPER_URLS: ${{ secrets.SCRAPER_URLS }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
        SCRAPING_PROXY: ${{ secrets.SCRAPING_PROXY }}
      run: |
        python telegram_bot.py
