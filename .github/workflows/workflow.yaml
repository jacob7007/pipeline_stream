name: Football Stream Automation Pipeline

on:
  workflow_dispatch:
    # Allow manual runs and API triggers from cron-job.org

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Get Playwright Version
      id: playwright-version
      run: echo "version=$(playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

    - name: Cache Playwright Chromium
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright Chromium (Only on Cache Miss)
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: playwright install chromium --with-deps

    - name: Run Stream Pipeline
      env:
        CLOUDFLARE_API_URL: ${{ secrets.CLOUDFLARE_API_URL }}
        CLOUDFLARE_SYNC_TOKEN: ${{ secrets.CLOUDFLARE_SYNC_TOKEN }}
        DEFAULT_PLAYER_URL: ${{ secrets.DEFAULT_PLAYER_URL }}
        SPREADSHEET_NAME: ${{ secrets.SPREADSHEET_NAME }}
        DEFAULT_TIMEZONE: ${{ secrets.DEFAULT_TIMEZONE }}
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        SCRAPER_URLS: ${{ secrets.SCRAPER_URLS }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
        SCRAPING_PROXY: ${{ secrets.SCRAPING_PROXY }}
      run: |
        python run_pipeline.py
