name: Football Stream Automation Pipeline

on:
  workflow_dispatch:
    # Allow manual runs and API triggers from cron-job.org

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Get Playwright Version
      id: playwright-version
      run: echo "version=$(playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

    - name: Cache Playwright Chromium
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright Chromium (Only on Cache Miss)
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: playwright install chromium --with-deps

    - name: Run Stream Pipeline
      env:
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
        BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        SCRAPING_PROXY: ${{ secrets.SCRAPING_PROXY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
        BLOG_ID: ${{ secrets.BLOG_ID }}
        BLOG_PLAYER_ID: ${{ secrets.BLOG_PLAYER_ID }}
        BLOG_DATA_ID: ${{ secrets.BLOG_DATA_ID }}
        DATA_PAGE_ID: ${{ secrets.DATA_PAGE_ID }}
        SPREADSHEET_NAME: ${{ secrets.SPREADSHEET_NAME }}
        DEFAULT_TIMEZONE: ${{ secrets.DEFAULT_TIMEZONE }}
        SCRAPER_URLS: ${{ secrets.SCRAPER_URLS }}
      run: |
        python run_pipeline.py
